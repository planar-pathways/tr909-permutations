<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TR-909 Permutations</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #fe52a7, green);
      color: #fff;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #ui {
      text-align: center;
    }
    button {
      font-family: monospace;
      font-size: 16px;
      padding: 10px 20px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    #counter {
      font-size: 43px;
      opacity: 1;
    }
      #logo-link {
  position: fixed;
  bottom: 15px;
  align-items: center;
}

#logo {
  width: 260px;           
  height: auto;
  opacity: 0;          
  cursor: pointer;
  transition: opacity 0.3s ease; 
}

#logo:hover {
  opacity: 1;             
}
      
#logo:active {
  opacity: 1;
}

  </style>
</head>
<body>
  <div id="ui">
    <button id="startBtn">PLAY</button>
    <div id="counter">PERMUTATION: 0</div>
  </div>

  <script src="main.js"></script>
<a href="http://vivapunani.org" target="_blank" id="logo-link">
  <img src="images/mentasmic-white.svg" alt="Logo" id="logo">
</a>

    
</body>
</html>
