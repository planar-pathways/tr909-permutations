<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TR-909 Permutations</title>
  <style>
      @font-face {
  font-family: 'peeps';
  src: url('fonts/peeps.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
      
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #fe52a7, green);
      color: #fff;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #ui {
      text-align: center;
    }
    button {
      font-family: monospace;
      font-size: 16px;
      padding: 10px 20px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    #counter {
      font-size: 43px;
      opacity: 1;
    }
      #logo-link {
  position: fixed;
  bottom: 15px;
  align-items: center;
}

#logo {
  width: 260px;           
  height: auto;
  opacity: 0;          
  cursor: pointer;
  transition: opacity 0.3s ease; 
}

#logo:hover {
  opacity: 1;             
}
      
#logo:active {
  opacity: 1;
}

      #bg-text,
.bg-line {
  font-family: 'peeps', monospace;
}

body::before {
  content: "ALL POSSIBLE PERMUTATIONS OF THE ELEVEN ONBOARD SOUNDS OF THE ROLAND TR-909.          MASSIVE THANKS: GUY BIRKIN, ARNAU HORTA, ANDREW FENCHEL, BORJA CARO, HUGO ESQUINCA, HAMPUS LINDVALL.           2021-2025 ROC JIMENEZ DE CISNEROS";
  position: fixed;
  top: 50;
  left: 50;
  width: 100%;
  height: 100%;
  font-family: 'peeps';
  font-size: 8.5vw;
  color: rgba(255,255,255,0.035);
  pointer-events: none;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  z-index: 0;
}
      
  #peek-image {
  position: fixed;
  bottom: -163px;          /* start hidden below screen */
  right: 30px;             /* choose side: left or right */
  width: 120px;            /* adjust size */
  opacity: 0;
  pointer-events: none;
  z-index: 1;

  animation: peekUp 12s ease-in-out 2s forwards;
}
     
@keyframes peekUp {
  0% {
    transform: translateY(20);
    opacity: 1;
  }
    
  20% {
    transform: translateY(-77px);
    opacity: 1;
  }

  40% {
    transform: translateY(-77px);
    opacity: 1;
  }

  60% {
    transform: translateY(-77px);
    opacity: 1;
  }

  100% {
    transform: translateY(0);
    opacity: 1;
  }
}

      
      
  </style>
</head>
<body>
  <div id="ui">
    <button id="startBtn">PLAY</button>
    <div id="counter">PERMUTATION: 0</div>
  </div>

  <script src="main.js"></script>
<a href="http://vivapunani.org" target="_blank" id="logo-link">
  <img src="images/mentasmic-white.svg" alt="Logo" id="logo">
</a>

<img src="images/peek.png" id="peek-image" alt="">

    
</body>
</html>
